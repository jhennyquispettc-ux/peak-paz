name: Publicar catálogo y Swagger en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Instalar dependencias
        run: |
          npm ci --prefix frontend
          npm ci --prefix backend
      - name: Exportar solo las rutas ficticias del repositorio
        run: npm run demo:export --prefix backend
      - name: Compilar catálogo y documentación
        run: npm run build:pages --prefix frontend
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_STATIC_DEMO: "true"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
