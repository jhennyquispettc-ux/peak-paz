name: peak-paz

services:
  postgres:
    image: postgres:17-alpine
    container_name: peak-paz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-peakpaz}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-peakpaz_dev}
      POSTGRES_DB: ${DB_NAME:-peak_paz}
      TZ: America/La_Paz
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-peakpaz} -d ${DB_NAME:-peak_paz}"]
      interval: 5s
      timeout: 5s
      retries: 10

  verification-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: peakpaz_verification
      POSTGRES_PASSWORD: ${VERIFICATION_DB_PASSWORD:?Run npm run setup}
      POSTGRES_DB: peak_paz_verification
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - verification_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peakpaz_verification -d peak_paz_verification"]
      interval: 3s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  verification:
    build: ./verification-service
    restart: unless-stopped
    env_file: ./verification-service/.env
    environment:
      DB_HOST: verification-db
      DB_PORT: 5432
      VERIFICATION_SERVICE_KEY: ${VERIFICATION_SERVICE_KEY:?Run npm run setup}
      DB_PASSWORD: ${VERIFICATION_DB_PASSWORD:?Run npm run setup}
      SMTP_URL: smtp://mailpit:1025
    ports:
      - "127.0.0.1:3020:3020"
    depends_on:
      verification-db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3020/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  verification_data:
