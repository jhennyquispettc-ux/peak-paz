name: peak-paz

services:
  postgres:
    image: postgres:17-alpine
    container_name: peak-paz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-peakpaz}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-peakpaz_dev}
      POSTGRES_DB: ${DB_NAME:-peak_paz}
      TZ: America/La_Paz
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-peakpaz} -d ${DB_NAME:-peak_paz}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
