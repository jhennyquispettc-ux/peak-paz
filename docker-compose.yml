name: peak-paz

services:
  postgres:
    image: postgres:17-alpine
    container_name: peak-paz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-peakpaz}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-peakpaz_dev}
      POSTGRES_DB: ${DB_NAME:-peak_paz}
      TZ: America/La_Paz
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-peakpaz} -d ${DB_NAME:-peak_paz}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    hostname: peak-paz-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: peakpaz
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run npm run setup}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5672"]
      interval: 5s
      timeout: 10s
      retries: 20

  verification-python:
    build:
      context: ./verification-python
      target: runtime
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://peakpaz:${RABBITMQ_PASSWORD:?Run npm run setup}@rabbitmq:5672
      SMTP_URL: smtp://mailpit:1025
      DOCUMENT_BASE_URL: http://host.docker.internal:3010
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3030:3030"
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3030/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  rabbitmq_data:
