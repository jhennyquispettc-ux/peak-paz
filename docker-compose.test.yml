name: peak-paz-verification-test
services:
  backend-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test-local-only
      POSTGRES_DB: peak_paz_test
    ports: ["127.0.0.1::5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d peak_paz_test"]
      interval: 1s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1::1025", "127.0.0.1::8025"]
  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: test
      RABBITMQ_DEFAULT_PASS: test-local-only
    ports: ["127.0.0.1::5672"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5672"]
      interval: 2s
      timeout: 10s
      retries: 40
  verification-python:
    build:
      context: ./verification-python
      target: test
    environment:
      RABBITMQ_URL: amqp://test:test-local-only@rabbitmq:5672
      SMTP_URL: smtp://mailpit:1025
      DOCUMENT_BASE_URL: http://host.docker.internal:3099
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3030/health')"]
      interval: 1s
      timeout: 3s
      retries: 40
