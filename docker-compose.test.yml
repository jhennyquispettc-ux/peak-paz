name: peak-paz-verification-test
services:
  backend-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test-local-only
      POSTGRES_DB: peak_paz_test
    ports: ["127.0.0.1::5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d peak_paz_test"]
      interval: 1s
      timeout: 3s
      retries: 30
  verification-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test-local-only
      POSTGRES_DB: verification_test
    ports: ["127.0.0.1::5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d verification_test"]
      interval: 1s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1::1025", "127.0.0.1::8025"]
